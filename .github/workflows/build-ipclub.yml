name: Build IPClub Remote Client (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build IPClub Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout Builder
        uses: actions/checkout@v4

      - name: Checkout RustDesk Source
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.3.8
          submodules: recursive
          path: rustdesk

      - name: Inject IPClub Config, Branding and CRT Static
        shell: bash
        run: |
          CONFIG_FILE="rustdesk/libs/hbb_common/src/config.rs"
          sed -i 's/pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[.*\];/pub const RENDEZVOUS_SERVERS: \&[\&str] = \&["remote.ipclub.com.br:21116"];/' "$CONFIG_FILE"
          sed -i 's/pub const RS_PUB_KEY: &str = ".*";/pub const RS_PUB_KEY: \&str = "SXGk63UFmwxk1YttM0z2lQ2AvusSZBr9l4qL+4sRe00=";/' "$CONFIG_FILE"
          sed -i 's/RwLock::new("RustDesk".to_owned())/RwLock::new("IPClub Remote".to_owned())/' "$CONFIG_FILE"

          # Replace window icon inside ui.rs with IPClub official icon
          python3 -c "
          with open('rustdesk/src/ui.rs', 'r', encoding='utf-8') as f:
              code = f.read()
          import re
          new_code = re.sub(r'\"data:image/png;base64,[A-Za-z0-9+/=]+\"\.into\(\)', '\"data:image/png;base64,\".into()', code)
          with open('rustdesk/src/ui.rs', 'w', encoding='utf-8') as f:
              f.write(new_code)
          "

          # Disable new version banner
          sed -i 's/{software_update_url ? <UpdateMe \/> : ""}//' rustdesk/src/ui/index.tis

          # Ensure static CRT linking in Cargo config
          mkdir -p rustdesk/.cargo
          cat << 'EOF' > rustdesk/.cargo/config.toml
[target.x86_64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static"]
EOF

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:/vcpkg
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          C:/vcpkg/vcpkg.exe install --triplet x64-windows-static libvpx libyuv opus aom
          mkdir -p rustdesk/installed/x64-windows-static
          cp -r C:/vcpkg/installed/x64-windows-static/* rustdesk/installed/x64-windows-static/ || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Build Executable
        shell: bash
        env:
          VCPKG_ROOT: C:/vcpkg
        run: |
          cd rustdesk
          python3 ./res/inline-sciter.py
          cargo build --release --features inline

      - name: Upload IPClub Remote Executable
        uses: actions/upload-artifact@v4
        with:
          name: IPClub-Remote-Windows-x64
          path: |
            rustdesk/target/release/rustdesk.exe
            rustdesk/target/release/IPClub-Remote.exe
